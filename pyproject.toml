[project]
name = "metrics"
version = "0.1.0"
description = "Tekton pipelines metrics"
authors = [
    {name = "exd-guild-isv"}
]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "flask>=3.1.3,<4.0.0",
    "gunicorn>=26.0.0,<27.0.0",
    "prometheus-client>=0.26.0,<0.27.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "operatorcert @ git+https://github.com/redhat-openshift-ecosystem/operator-pipelines.git",
    "pydantic>=2.13.4,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.9.4",
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pylint>=4.0.7",
    "tox>=4.60.0",
    "yamllint>=1.38.0",
    "types-pyyaml>=6.0.12.20260724",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["metrics*"]

